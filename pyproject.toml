[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-odds-v3"
version = "3.0.0"
description = "Surebet and Back/Lay odds calculation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scan-odds = "scan_odds.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scan_odds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
